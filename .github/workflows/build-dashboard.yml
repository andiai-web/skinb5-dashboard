name: Build SkinB5 Dashboard

# Triggers: runs automatically when Excel file is updated
# Also runs manually if needed (Actions tab → Run workflow)
on:
  push:
    paths:
      - 'data/SkinB5_Master_KPI_Tracker.xlsx'
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name  "SkinB5 Dashboard Bot"
          git config user.email "dashboard@skinb5.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Dashboard updated $(date +'%-d %b %Y %H:%M AEST')"
          git push
